# Install at /etc/nginx/sites-enabled/supra after issuing the first certificate.
limit_req_zone $binary_remote_addr zone=supra_login:1m rate=10r/m;
server {
    listen 80;
    server_name API_HOSTNAME;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 308 https://API_HOSTNAME$request_uri; }
}
server {
    listen 443 ssl;
    server_name API_HOSTNAME;
    ssl_certificate /etc/letsencrypt/live/API_HOSTNAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/API_HOSTNAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 5m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    location = /api/auth/username-login {
        limit_req zone=supra_login burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:3000;
    }
    location / { proxy_pass http://127.0.0.1:3000; }
}
