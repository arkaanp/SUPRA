worker_processes 1;
daemon off;
pid /tmp/supra-nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/supra-nginx-body;
    proxy_temp_path /tmp/supra-nginx-proxy;
    fastcgi_temp_path /tmp/supra-nginx-fastcgi;
    uwsgi_temp_path /tmp/supra-nginx-uwsgi;
    scgi_temp_path /tmp/supra-nginx-scgi;
    # A shared demo-wide limit avoids trusting arbitrary forwarded IP headers.
    limit_req_zone $server_name zone=username_login:1m rate=30r/m;
    limit_req_zone $server_name zone=username_register:1m rate=8r/m;
    server {
        listen 0.0.0.0:RENDER_PORT;
        server_name supra;
        client_max_body_size 5m;
        location = /api/auth/username-login {
            client_max_body_size 16k;
            limit_req zone=username_login burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:3000;
        }
        location = /api/auth/register {
            client_max_body_size 16k;
            limit_req zone=username_register burst=8 nodelay;
            limit_req_status 429;
            proxy_pass http://127.0.0.1:3000;
        }
        location / { proxy_pass http://127.0.0.1:3000; }
    }
}
